<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Labels demo</title>
  <link rel="stylesheet" href="/storefront/styles/product-labels.css">
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px 16px; background: #fafafa; color: #1f1f1f; }
    header { max-width: 1200px; margin: 0 auto 24px; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    p { margin: 0; color: #555; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; overflow: hidden; }
    .card__image { display: block; aspect-ratio: 1; background: #f0f0f0; }
    .card__image img { width: 100%; height: 100%; object-fit: contain; }
    .card__body { padding: 12px; font-size: 14px; }
    .card__name { margin: 0 0 4px; font-weight: 600; }
    .card__price s { color: #888; margin-left: 6px; }
    .status { max-width: 1200px; margin: 0 auto 16px; }
    h2.status { margin-top: 32px; font-size: 18px; }
  </style>
</head>
<body>
  <header>
    <h1>Product Labels demo</h1>
    <p>Products from Catalog Service, labelled in the browser by the storefront kit with <code>demo/rules.json</code>.</p>
  </header>
  <h2 class="status">Sample products</h2>
  <p class="status">Made-up prices and stock, because the demo catalog hides prices from guests.</p>
  <section class="grid" id="samples"></section>
  <h2 class="status">Catalog Service products</h2>
  <p class="status" id="status">Loading products…</p>
  <main class="grid" id="grid"></main>
  <script type="module" src="/demo/demo.js"></script>
</body>
</html>
